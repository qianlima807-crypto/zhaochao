<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>榜单详情</title><style>body{margin:0;font-family:Inter,"PingFang SC",sans-serif;background:#f6f8fb;color:#111827}.wrap{max-width:900px;margin:28px auto;padding:0 16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px}.muted{color:#6b7280}.bar{height:14px;background:#eff6ff;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#2563eb)}</style></head><body><div class='wrap'><a href='rankings.html'>← 返回月榜中心</a><div class='card'><h1 id='t'></h1><p class='muted' id='desc'></p><div id='list'></div></div></div><script>const q=new URLSearchParams(location.search),dim=q.get('dim')||'speed',month=q.get('month')||'2026-06';const data={sites:["千里马招标网","六度标讯","采招网","中国招标网","比地招标网","采购与招标网"],speed:[11,16,58,263,277,334],recall:[97,95.5,89.4,84.6,83.1,79.9],dedup:[94.4,93.8,90.6,88.6,86.7,84.6]};const title={speed:'更新速度',recall:'召回率',dedup:'去重率'}[dim];document.getElementById('t').textContent=`${month} ${title}榜单`;document.getElementById('desc').textContent=dim==='speed'?'大白话：越小越快，11分钟比58分钟快很多。':'大白话：越高越好，代表更全或更干净。';const arr=data.sites.map((s,i)=>({s,v:data[dim][i]})).sort((a,b)=>dim==='speed'?a.v-b.v:b.v-a.v);document.getElementById('list').innerHTML=arr.map((x,i)=>`<div style='margin:10px 0'><div style='display:flex;justify-content:space-between'><b>${i+1}. ${x.s}</b><span>${x.v}${dim==='speed'?' 分钟':'%'}</span></div><div class='bar'><span style='width:${dim==='speed'?Math.max(5,100-x.v/4):x.v}%'></span></div></div>`).join('')</script></body></html>
