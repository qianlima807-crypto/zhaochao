<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>月度榜单中心</title><style>body{margin:0;font-family:Inter,"PingFang SC",sans-serif;background:#f6f8fb;color:#111827}.wrap{max-width:1000px;margin:28px auto;padding:0 16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin-bottom:12px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}a.item{display:block;text-decoration:none;color:#111827;border:1px solid #e5e7eb;border-radius:10px;padding:10px;background:#fafafa;margin-bottom:8px}.item:hover{border-color:#2563eb}.muted{font-size:12px;color:#6b7280}@media(max-width:900px){.grid{grid-template-columns:1fr}}</style></head><body><div class='wrap'><a href='index.html'>← 返回首页</a><h1>月度榜单中心</h1><p class='muted'>按维度浏览 2026 年 1-6 月榜单，点击进入详情页。</p><div class='grid' id='grid'></div></div><script>const months=['2026-01','2026-02','2026-03','2026-04','2026-05','2026-06'];const dims=[['speed','更新速度月榜单','值越小越快'],['recall','召回率月榜单','值越高越全'],['dedup','去重率月榜单','值越高越干净']];document.getElementById('grid').innerHTML=dims.map(d=>`<div class='card'><h3>${d[1]}</h3><div class='muted'>${d[2]}</div>${months.map(m=>`<a class='item' href='ranking-detail.html?dim=${d[0]}&month=${m}'>${m} ${d[1]} →</a>`).join('')}</div>`).join('')</script></body></html>
