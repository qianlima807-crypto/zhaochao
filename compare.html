<!doctype html><html lang='zh-CN'><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>网站对比任务</title><style>body{margin:0;font-family:Inter,"PingFang SC",sans-serif;background:#f6f8fb;color:#111827}.wrap{max-width:1100px;margin:24px auto;padding:0 16px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:14px;margin-bottom:12px}h1{margin:0 0 8px}.muted{color:#6b7280}.row{display:grid;grid-template-columns:1.1fr 1fr;gap:12px}.controls{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}label{font-size:12px;color:#6b7280;display:block;margin-bottom:4px}select,input,button{width:100%;padding:9px;border:1px solid #d1d5db;border-radius:10px}button{background:#2563eb;color:#fff;border-color:#2563eb;font-weight:600}.sites{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;max-height:220px;overflow:auto;border:1px solid #e5e7eb;border-radius:10px;padding:8px}.log{height:240px;overflow:auto;background:#0b1020;color:#cfe2ff;border-radius:10px;padding:10px;font-family:ui-monospace,monospace;font-size:12px}.hidden{display:none}.result-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.pill{display:inline-block;padding:2px 8px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:12px}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px;border-bottom:1px solid #e5e7eb;text-align:left}.bar{height:12px;background:#eff6ff;border-radius:999px;overflow:hidden}.bar span{display:block;height:100%;background:linear-gradient(90deg,#60a5fa,#2563eb)}@media(max-width:920px){.row,.result-grid,.controls,.sites{grid-template-columns:1fr}}</style></head><body><div class='wrap'><a href='index.html'>← 返回首页</a><h1>用户对比任务</h1><div class='muted'>默认2个网站，可选3~10个。为便于用户感知，任务执行时展示实时“采集中”日志与预计完成时间。</div>
<div class='card row'><div><div class='controls'><div><label>账号</label><input value='demo_user@site.com'></div><div><label>密码</label><input type='password' value='123456'></div></div><div style='margin-top:10px'><label>选择对比网站（2~10）</label><div class='sites' id='sites'></div></div><div class='controls' style='margin-top:10px'><div><label>公告类型</label><select><option>全部</option><option>中标公告</option></select></div><div><label>预计样本量</label><select><option>500</option><option selected>1200</option><option>3000</option></select></div></div><div style='margin-top:10px'><button id='start'>开始执行对比任务</button></div></div><div><h3>任务执行窗口 <span class='pill' id='eta'>预计完成：--</span></h3><div class='log' id='log'></div></div></div>
<div class='card hidden' id='result'><h3>可验证结果（你可以逐条核对）</h3><div class='result-grid'><div><h4>召回率验证清单</h4><table><thead><tr><th>项目名</th><th>源站有</th><th>目标站有</th></tr></thead><tbody id='verify'></tbody></table></div><div><h4>图表结论</h4><div id='charts'></div></div></div></div></div>
<script>
const sites=["千里马招标网","六度标讯","采招网","中国招标网","比地招标网","采购与招标网","中国政府采购网镜像","乙方宝","招标雷达","公共资源网聚合"];const box=document.getElementById('sites');sites.forEach((s,i)=>box.innerHTML+=`<label><input type='checkbox' value='${s}' ${i<2?'checked':''}> ${s}</label>`);
const steps=["正在加载爬虫资源...","正在分配节点任务...","正在随机采集样本信息...","正在抓取项目1/2/3/4...","正在进行跨站匹配...","正在计算更新速度P50/P95...","正在计算召回率与去重率..."];
function run(){const picked=[...document.querySelectorAll('#sites input:checked')].map(x=>x.value);if(picked.length<2||picked.length>10){alert('请选择2到10个网站');return;}document.getElementById('result').classList.add('hidden');const log=document.getElementById('log');log.innerHTML='';const eta=Math.max(2,Math.ceil(picked.length*0.8));document.getElementById('eta').textContent=`预计完成：${eta} 分钟`;let i=0;const timer=setInterval(()=>{log.innerHTML+=`[${new Date().toLocaleTimeString()}] ${steps[i%steps.length]}\n`;log.scrollTop=log.scrollHeight;i++;if(i===12){clearInterval(timer);finish(picked);}},700)}
function finish(picked){const samples=[['中国安全生产科学研究院气体泄漏监测管控设施采购中标公告','是','是'],['XX市智慧校园设备采购公告','是','否'],['某医院检验试剂采购项目中标公告','是','是'],['某区道路提升工程招标公告','是','否'],['某高校实验室改造项目','是','是']];
  document.getElementById('verify').innerHTML=samples.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td style='color:${r[2]==='是'?'#16a34a':'#dc2626'}'>${r[2]}</td></tr>`).join('');
  const recall=Math.round(samples.filter(x=>x[2]==='是').length/samples.length*100); const speed=Math.max(10,120-picked.length*8); const dedup=90-picked.length;
  document.getElementById('charts').innerHTML=`<p>结论：本次比较了 <b>${picked.length}</b> 个网站。召回率 <b>${recall}%</b>，中位更新时长(P50) <b>${speed} 分钟</b>，去重率 <b>${dedup}%</b>。</p>
  <p class='muted'>说明（大白话）：召回率就是该抓到的公告抓到了多少；去重率就是重复公告清理得干不干净。</p>
  <div style='margin-bottom:8px'>召回率<div class='bar'><span style='width:${recall}%'></span></div></div>
  <div style='margin-bottom:8px'>去重率<div class='bar'><span style='width:${dedup}%'></span></div></div>
  <div style='margin-bottom:8px'>速度得分<div class='bar'><span style='width:${Math.max(5,100-speed/2)}%'></span></div></div>`;
  document.getElementById('result').classList.remove('hidden');
}
document.getElementById('start').onclick=run;
</script></body></html>
